<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H+Medical</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">
  <span style="left:10%"></span>
  <span style="left:30%"></span>
  <span style="left:50%"></span>
  <span style="left:70%"></span>
  <span style="left:90%"></span>
</div>
  
<div class="container">
  <h1 id="welcome">H+Medical</h1>

  <p>Konsultasi kesehatan berbasis AI</p>

  <button onclick="cekLogin()" class="btn">Mulai Konsultasi</button>

  <button onclick="getLocation()" class="btn">📍 Cari RS Terdekat</button>
</div>

<script>
function cekLogin(){
  let user = localStorage.getItem("user");

  if(!user){
    window.location.href = "login.html";
  }else{
    window.location.href = "konsultasi.html";
  }
}

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      window.open(
        "https://www.google.com/maps/search/rumah+sakit/@" + lat + "," + lon,
        "_blank"
      );
    });
  }else{
    alert("GPS tidak didukung");
  }
}

let user = JSON.parse(localStorage.getItem("user"));
if(user){
  document.getElementById("welcome").innerText = "Halo, " + user.nama;
}
</script>

</body>
</html>
