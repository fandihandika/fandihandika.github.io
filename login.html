<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">
  <span style="left:10%"></span>
  <span style="left:30%"></span>
  <span style="left:50%"></span>
  <span style="left:70%"></span>
  <span style="left:90%"></span>
</div>
  
<div class="container">
  <h1>Login H+Medical</h1>

  <input type="text" id="nama" placeholder="Nama" class="btn">
  <input type="number" id="hp" placeholder="Nomor HP" class="btn">

  <button onclick="login()" class="btn">Masuk</button>
</div>

<script>
function login(){
  let nama = document.getElementById("nama").value;
  let hp = document.getElementById("hp").value;

  if(!nama || !hp){
    alert("Isi data dulu");
    return;
  }

  localStorage.setItem("user", JSON.stringify({nama, hp}));
  window.location.href = "index.html";
}
</script>

</body>
</html>
