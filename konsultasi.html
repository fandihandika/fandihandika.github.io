<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsultasi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">
  <span style="left:10%; animation-delay:0s;"></span>
  <span style="left:30%; animation-delay:2s;"></span>
  <span style="left:50%; animation-delay:4s;"></span>
  <span style="left:70%; animation-delay:1s;"></span>
  <span style="left:90%; animation-delay:3s;"></span>
</div>

<div class="container">
  <h1>Konsultasi AI</h1>

  <textarea id="input" placeholder="Contoh: demam, batuk, sesak..."></textarea>

  <button id="btn" class="btn">Analisa</button>

  <div id="hasil"></div>

  <br>
  <a href="tel:119" class="btn" style="background:red; color:white;">🚨 DARURAT</a>

  <br><br>
  <a href="index.html">⬅ Kembali</a>
</div>

<script>
document.getElementById("btn").onclick = function () {
  var text = document.getElementById("input").value.toLowerCase();
  var hasil = document.getElementById("hasil");

  if (!text) {
    hasil.innerHTML = "⚠️ Isi keluhan dulu";
    return;
  }

  hasil.innerHTML = "🤖 AI sedang menganalisa...";

  setTimeout(function () {
    if (text.indexOf("sesak") !== -1 || text.indexOf("pingsan") !== -1) {
      hasil.innerHTML =
        "🚨 <b>LEVEL 3 (DARURAT)</b><br><br>" +
        "• Segera ke rumah sakit<br>" +
        "• Hubungi 119<br>" +
        "• Pastikan pasien tetap sadar<br>" +
        "• Longgarkan pakaian<br>";
    } 
    else if (text.indexOf("demam") !== -1 || text.indexOf("batuk") !== -1) {
      hasil.innerHTML =
        "🟡 <b>LEVEL 1 (RINGAN)</b><br><br>" +
        "• Istirahat cukup<br>" +
        "• Minum air hangat<br>" +
        "• Bisa minum paracetamol<br>" +
        "• Jika 3 hari tidak membaik → ke dokter";
    } 
    else {
      hasil.innerHTML =
        "🟠 <b>LEVEL 2 (MENENGAH)</b><br><br>" +
        "• Disarankan ke dokter<br>" +
        "• Hindari aktivitas berat<br>" +
        "• Pantau kondisi tubuh<br>";
    }
  }, 1500);
};
</script>

</body>
</html>
