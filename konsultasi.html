<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsultasi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">
  <span style="left:10%; animation-delay:0s;"></span>
  <span style="left:30%; animation-delay:2s;"></span>
  <span style="left:50%; animation-delay:4s;"></span>
  <span style="left:70%; animation-delay:1s;"></span>
  <span style="left:90%; animation-delay:3s;"></span>
</div>

<div class="container">
  <h1>Konsultasi AI</h1>

  <textarea id="input" placeholder="Contoh: demam tinggi, batuk, sesak nafas..."></textarea>

  <button id="btn" class="btn">Analisa</button>

  <div id="hasil"></div>

  <br>
  <a href="tel:119" class="btn" style="background:red; color:white;">🚨 DARURAT</a>

  <br><br>
  <a href="index.html">⬅ Kembali</a>
</div>

<script>
document.getElementById("btn").onclick = function () {
  var text = document.getElementById("input").value.toLowerCase();
  var hasil = document.getElementById("hasil");

  if (!text) {
    hasil.innerHTML = "⚠️ Isi keluhan dulu";
    return;
  }

  hasil.innerHTML = "🤖 AI sedang menganalisa...";

  setTimeout(function () {

    // 🔴 LEVEL 3 (DARURAT)
    if (
      text.includes("sesak") ||
      text.includes("pingsan") ||
      text.includes("tidak sadar") ||
      text.includes("kejang") ||
      text.includes("nyeri dada hebat")
    ) {
      hasil.innerHTML =
        "🚨 <b>LEVEL 3 (DARURAT)</b><br><br>" +
        "Kemungkinan kondisi serius.<br><br>" +
        "• Segera ke rumah sakit<br>" +
        "• Hubungi 119<br>" +
        "• Jangan ditunda<br>" +
        "• Pastikan pasien bernapas<br>";
    }

    // 🟠 LEVEL 2 (MENENGAH)
    else if (
      text.includes("demam tinggi") ||
      text.includes("muntah terus") ||
      text.includes("diare parah") ||
      text.includes("sakit perut hebat") ||
      text.includes("pusing berat")
    ) {
      hasil.innerHTML =
        "🟠 <b>LEVEL 2 (MENENGAH)</b><br><br>" +
        "Perlu penanganan medis.<br><br>" +
        "• Segera periksa ke dokter<br>" +
        "• Minum air cukup<br>" +
        "• Istirahat total<br>";
    }

    // 🟡 LEVEL 1 (RINGAN)
    else if (
      text.includes("demam") ||
      text.includes("batuk") ||
      text.includes("pilek") ||
      text.includes("flu") ||
      text.includes("masuk angin")
    ) {
      hasil.innerHTML =
        "🟡 <b>LEVEL 1 (RINGAN)</b><br><br>" +
        "Masih bisa dirawat di rumah.<br><br>" +
        "• Istirahat cukup<br>" +
        "• Minum air hangat<br>" +
        "• Konsumsi obat ringan<br>" +
        "• Jika >3 hari tidak sembuh → ke dokter";
    }

    // ❓ TIDAK TERDETEKSI
    else {
      hasil.innerHTML =
        "⚠️ Keluhan belum dikenali.<br><br>" +
        "Coba tulis lebih detail.<br><br>" +
        "Contoh:<br>" +
        "• demam tinggi 3 hari<br>" +
        "• sesak napas<br>" +
        "• sakit perut hebat";
    }

  }, 1500);
};
</script>

</body>
</html>
