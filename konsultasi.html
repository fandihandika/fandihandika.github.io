<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsultasi</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Konsultasi AI</h1>
  <p id="user"></p>

  <textarea id="input" placeholder="Contoh: demam tinggi, sesak napas..."></textarea>

  <button id="btn" class="btn">Analisa</button>

  <div id="hasil"></div>

  <br>
  <a href="tel:119" class="btn" style="background:red;color:white;">🚨 Ambulans</a>

  <br>
  <button onclick="getLocation()" class="btn">📍 RS Terdekat</button>

  <br><br>
  <a href="index.html">⬅ Kembali</a>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
if(user){
  document.getElementById("user").innerText = "User: " + user.nama + " (" + user.hp + ")";
}

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      window.open(
        "https://www.google.com/maps/search/rumah+sakit/@" + lat + "," + lon,
        "_blank"
      );
    });
  }
}

document.getElementById("btn").onclick = function () {
  let text = document.getElementById("input").value.toLowerCase();
  let hasil = document.getElementById("hasil");

  if (!text) {
    hasil.innerHTML = "⚠️ Isi keluhan dulu";
    return;
  }

  hasil.innerHTML = "🤖 AI sedang menganalisa...";

  setTimeout(function () {

    if(text.includes("sesak") || text.includes("pingsan")){
      hasil.innerHTML = "🚨 DARURAT<br>Segera ke RS & hubungi 119<br>Longgarkan pakaian & bantu napas";
    }
    else if(text.includes("demam")){
      hasil.innerHTML = "🟡 DEMAM<br>Minum air, kompres, paracetamol, istirahat";
    }
    else{
      hasil.innerHTML = "🟠 MENENGAH<br>Istirahat & segera ke dokter";
    }

  }, 1200);
};
</script>

</body>
</html>
