<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsultasi AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ANIMASI -->
<div class="bg">
  <span style="left:10%"></span>
  <span style="left:30%"></span>
  <span style="left:50%"></span>
  <span style="left:70%"></span>
  <span style="left:90%"></span>
</div>

<div class="container">
  <h1>Konsultasi AI</h1>
  <p id="user"></p>

  <textarea id="input" placeholder="Contoh: demam tinggi 3 hari, sesak napas..."></textarea>

  <button id="btn" class="btn">Analisa AI</button>

  <div id="hasil"></div>

  <!-- RIWAYAT -->
  <div id="history" class="history"></div>

  <br>

  <!-- FITUR -->
  <a href="tel:119" class="btn" style="background:red;color:white;">🚨 Ambulans</a>

  <button onclick="getLocation()" class="btn">📍 RS Terdekat</button>

  <a href="tel:08123456789" class="btn">📞 Dokter</a>
  <a href="tel:08123456788" class="btn">👩‍⚕️ Bidan</a>

  <br><br>
  <a href="index.html">⬅ Kembali</a>
</div>

<script>
// USER
let user = JSON.parse(localStorage.getItem("user"));
if(user){
  document.getElementById("user").innerText = "User: " + user.nama;
}

// GPS
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      window.open(
        "https://www.google.com/maps/search/rumah+sakit/@" + lat + "," + lon,
        "_blank"
      );
    });
  }
}

// SIMPAN RIWAYAT
function saveHistory(text, result){
  let data = JSON.parse(localStorage.getItem("riwayat")) || [];
  data.unshift({text, result});
  localStorage.setItem("riwayat", JSON.stringify(data));
  loadHistory();
}

function loadHistory(){
  let data = JSON.parse(localStorage.getItem("riwayat")) || [];
  let el = document.getElementById("history");

  el.innerHTML = "<h3>Riwayat</h3>";

  data.slice(0,5).forEach(item=>{
    el.innerHTML += "<div style='background:rgba(255,255,255,0.1);margin:5px;padding:8px;border-radius:8px'>" 
    + item.text + "<br>" + item.result + "</div>";
  });
}

// AI
document.getElementById("btn").onclick = function () {
  let text = document.getElementById("input").value.toLowerCase();
  let hasil = document.getElementById("hasil");

  if (!text) {
    hasil.innerHTML = "⚠️ Isi keluhan dulu";
    return;
  }

  hasil.innerHTML = "🤖 AI sedang menganalisa...";

  setTimeout(function () {

    let res = "";

    if (text.includes("sesak") || text.includes("pingsan") || text.includes("nyeri dada")) {
      res = "🚨 DARURAT<br>• Baringkan pasien<br>• Longgarkan pakaian<br>• Hubungi 119";
    }
    else if (text.includes("demam tinggi") || text.includes("muntah") || text.includes("diare")) {
      res = "🟠 MENENGAH<br>• Minum banyak<br>• Istirahat<br>• Periksa dokter";
    }
    else if (text.includes("demam") || text.includes("batuk") || text.includes("flu")) {
      res = "🟡 RINGAN<br>• Istirahat<br>• Minum hangat<br>• Obat ringan";
    }
    else {
      res = "⚠️ Tidak dikenali, coba lebih detail";
    }

    hasil.innerHTML = res;
    saveHistory(text, res);

  }, 1200);
};

loadHistory();
</script>

</body>
</html>
