<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsultasi</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .card {
      background: rgba(255,255,255,0.15);
      padding: 15px;
      border-radius: 15px;
      margin-top: 20px;
      text-align: left;
    }

    .history {
      margin-top: 30px;
      text-align: left;
      font-size: 13px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history div {
      background: rgba(255,255,255,0.1);
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="bg">
  <span style="left:10%"></span>
  <span style="left:30%"></span>
  <span style="left:50%"></span>
  <span style="left:70%"></span>
  <span style="left:90%"></span>
</div>

<div class="container">
  <h1>Konsultasi AI</h1>

  <textarea id="input" placeholder="Contoh: demam tinggi, sakit perut, sesak..."></textarea>

  <button id="btn" class="btn">Analisa</button>

  <div id="hasil"></div>

  <div class="history" id="history">
    <h3>Riwayat Konsultasi</h3>
  </div>

  <br>
  <a href="tel:119" class="btn" style="background:red; color:white;">🚨 DARURAT</a>

  <br><br>
  <a href="index.html">⬅ Kembali</a>
</div>

<script>
function saveHistory(text, result){
  let data = JSON.parse(localStorage.getItem("riwayat")) || [];
  data.unshift({text, result});
  localStorage.setItem("riwayat", JSON.stringify(data));
  loadHistory();
}

function loadHistory(){
  let data = JSON.parse(localStorage.getItem("riwayat")) || [];
  let historyDiv = document.getElementById("history");
  historyDiv.innerHTML = "<h3>Riwayat Konsultasi</h3>";

  data.slice(0,5).forEach(item => {
    historyDiv.innerHTML += "<div>📝 " + item.text + "<br>" + item.result + "</div>";
  });
}

document.getElementById("btn").onclick = function () {
  var text = document.getElementById("input").value.toLowerCase();
  var hasil = document.getElementById("hasil");

  if (!text) {
    hasil.innerHTML = "⚠️ Isi keluhan dulu";
    return;
  }

  hasil.innerHTML = "🤖 AI sedang menganalisa...";

  setTimeout(function () {
    var result = "";

    // LEVEL 3
    if (
      text.includes("sesak") ||
      text.includes("pingsan") ||
      text.includes("kejang") ||
      text.includes("nyeri dada")
    ) {
      result =
      "🚨 <b>LEVEL 3 (DARURAT)</b><br><br>" +
      "• Segera ke rumah sakit<br>" +
      "• Hubungi 119<br>" +
      "• Jangan ditunda<br>";
    }

    // LEVEL 2
    else if (
      text.includes("demam tinggi") ||
      text.includes("muntah") ||
      text.includes("diare") ||
      text.includes("sakit perut") ||
      text.includes("pusing berat")
    ) {
      result =
      "🟠 <b>LEVEL 2 (MENENGAH)</b><br><br>" +
      "• Periksa ke dokter<br>" +
      "• Istirahat<br>" +
      "• Minum cukup<br>";
    }

    // LEVEL 1
    else if (
      text.includes("demam") ||
      text.includes("batuk") ||
      text.includes("pilek") ||
      text.includes("flu")
    ) {
      result =
      "🟡 <b>LEVEL 1 (RINGAN)</b><br><br>" +
      "• Istirahat<br>" +
      "• Minum hangat<br>" +
      "• Obat ringan<br>";
    }

    else {
      result =
      "⚠️ Tidak dikenali<br>Coba tulis lebih detail";
    }

    hasil.innerHTML = '<div class="card">' + result + '</div>';
    saveHistory(text, result);

  }, 1200);
};

loadHistory();
</script>

</body>
</html>
