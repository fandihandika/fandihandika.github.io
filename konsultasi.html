<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsultasi AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Konsultasi AI</h1>
  <p id="user"></p>

  <textarea id="input" placeholder="Tulis keluhan kesehatan kamu..."></textarea>

  <button id="btn" class="btn">Analisa AI</button>

  <div id="hasil"></div>

  <br>
  <a href="tel:119" class="btn" style="background:red;color:white;">🚨 Ambulans</a>

  <br>
  <button onclick="getLocation()" class="btn">📍 RS Terdekat</button>

  <br><br>
  <a href="index.html">⬅ Kembali</a>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
if(user){
  document.getElementById("user").innerText = "User: " + user.nama;
}

// 🔥 GANTI API KEY DI SINI
const API_KEY = "ISI_API_KEY_KAMU";

document.getElementById("btn").onclick = async function () {
  let text = document.getElementById("input").value;
  let hasil = document.getElementById("hasil");

  if (!text) {
    hasil.innerHTML = "⚠️ Isi keluhan dulu";
    return;
  }

  hasil.innerHTML = "🤖 AI sedang menganalisa...";

  try {
    let response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {
            role: "system",
            content: "Kamu adalah asisten medis yang memberikan pertolongan pertama sederhana, aman, dan tidak menggantikan dokter."
          },
          {
            role: "user",
            content: text
          }
        ]
      })
    });

    let data = await response.json();

    let hasilAI = data.choices[0].message.content;

    hasil.innerHTML = hasilAI;

  } catch (e) {
    hasil.innerHTML = "❌ Gagal konek AI";
  }
};

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      window.open(
        "https://www.google.com/maps/search/rumah+sakit/@" + lat + "," + lon,
        "_blank"
      );
    });
  }
}
</script>

</body>
</html>
